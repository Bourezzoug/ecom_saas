memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
opcache.enable = 1
opcache.validate_timestamps = 1
; Check file timestamps at most once per second: code edits show up within 1s,
; but a request no longer stats every file on the slow Windows bind mount.
opcache.revalidate_freq = 1
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
realpath_cache_ttl = 600
